[build]
  # Root install, then the two SPAs — ui/dist keeps publishing at the site
  # root exactly as before; the workbench build additionally sets
  # WORKBENCH_BASE (vite.config.ts) so every asset URL resolves under
  # /workbench/, and VITE_MCP_TRANSPORT=netlify (workbench/src/api/client.ts)
  # so it talks to this site's own Netlify Identity + /api/workspace-mcp
  # broker instead of fixtures or workbench-broker/ (not deployed here).
  # workbench/dist is copied into ui/dist/workbench so one `publish` dir
  # serves both apps.
  command = "npm install --no-fund --no-audit && npm --prefix ui install --no-fund --no-audit && npm run ui:build && npm --prefix workbench install --no-fund --no-audit && WORKBENCH_BASE=/workbench/ VITE_MCP_TRANSPORT=netlify npm --prefix workbench run build && mkdir -p ui/dist/workbench && cp -r workbench/dist/. ui/dist/workbench/"
  publish = "ui/dist"
  functions = "netlify/functions"

[build.environment]
  # workbench/package.json carries Playwright as a devDependency (its own
  # test suite, not run as part of this build); this stops any browser
  # binary download from happening during `npm --prefix workbench install`.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  node_bundler = "esbuild"


[[redirects]]
  from = "/api/agent"
  to = "/.netlify/functions/agent"
  status = 200

[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200


[[redirects]]
  from = "/api/session"
  to = "/.netlify/functions/session"
  status = 200

[[redirects]]
  from = "/api/workspace-mcp"
  to = "/.netlify/functions/workspace-mcp"
  status = 200

# MCP Authorization (OAuth) discovery + endpoints. These MUST precede the SPA catch-all below;
# otherwise `/* -> /index.html` serves the dashboard HTML for these paths and a remote MCP client
# (Claude's connector) can never discover the authorization server or complete the flow.
[[redirects]]
  from = "/.well-known/oauth-protected-resource"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-protected-resource/*"
  to = "/.netlify/functions/oauth-protected-resource"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server"
  to = "/.netlify/functions/oauth-authorization-server"
  status = 200

[[redirects]]
  from = "/.well-known/oauth-authorization-server/*"
  to = "/.netlify/functions/oauth-authorization-server"
  status = 200

[[redirects]]
  from = "/oauth/register"
  to = "/.netlify/functions/oauth-register"
  status = 200

[[redirects]]
  from = "/oauth/authorize"
  to = "/.netlify/functions/oauth-authorize"
  status = 200

[[redirects]]
  from = "/oauth/token"
  to = "/.netlify/functions/oauth-token"
  status = 200

# Conductor Workbench SPA, built to ui/dist/workbench by the build command
# above. Must precede the "/*" catch-all below — otherwise that rule would
# match first and always serve the root app's index.html under /workbench/*
# too, same reasoning as the OAuth block above.
[[redirects]]
  from = "/workbench"
  to = "/workbench/index.html"
  status = 200

[[redirects]]
  from = "/workbench/*"
  to = "/workbench/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
