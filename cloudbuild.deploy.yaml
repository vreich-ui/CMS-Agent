# Trigger config for `cms-agent-mcp-deploy`: build the MCP image from Dockerfile.mcp, push it, deploy
# it to Cloud Run, then PROVE what is actually serving.
#
# WHY THIS IS A FILE AND NOT INLINE TRIGGER YAML
#
# The trigger ran an inline build config for a week. Inline config cannot be reviewed, diffed, blamed or
# reverted, and nothing in the repository told you what a push to main would do to production. It also
# hid two defects for that whole week: a missing `options.logging` that made every build fail before its
# first step, and a mutable `:latest` image tag. Point the trigger at this file — Trigger → Edit →
# Configuration → Cloud Build configuration file → /cloudbuild.deploy.yaml — so the release path is
# version-controlled like everything else.
#
# This is a faithful drop-in for the inline config it replaces: same service, same runtime service
# account, same CPU/memory/instance settings, and the same --update-env-vars / --update-secrets sets.
# Two things are deliberately different, both fixes: the image is tagged with the commit instead of
# `latest`, and the deploy is verified afterwards.
#
# THE DEPLOY FLAGS THEMSELVES NO LONGER LIVE HERE (KNOWN_ISSUES C-12). They live in
# scripts/deploy-service.sh, which scripts/deploy-mcp.sh also runs — one artifact describing one
# service, so the trigger path and the shell path cannot disagree about its shape. This is the same
# arrangement deploy/executor-jobs.txt gives the job list.
#
# WHEN REPOINTING, DELETE THE TRIGGER'S `_IMAGE` SUBSTITUTION.
# Trigger substitutions OVERRIDE the defaults below. Leaving `_IMAGE=...:latest` on the trigger silently
# defeats the commit tagging — the build would still succeed, which is what makes it worth saying twice.
# `_DEPLOY_REGION` and `_GCS_BUCKET` should stay; this file uses both.
#
# MERGE FLAGS, NEVER --set-*.
# --update-env-vars / --update-secrets change only the keys named and leave everything else untouched.
# --set-env-vars REPLACES the service's entire environment, and has silently deleted the six
# client-connection variables twice while repository.get_health stayed green — workspace state lives in
# GCS and is independent of the revision, so health cannot see it. The blast radius is larger now:
# DR_LURIE_PUBLISH_ENABLED and PLATFORM_PUBLISH_ENABLED live in that same environment and are NOT named
# below precisely so that a deploy can never disturb them.

substitutions:
  _SERVICE: cms-agent-mcp
  _DEPLOY_REGION: us-central1
  _REPO: cms-agent
  _RUNTIME_SA: cms-agent-run@cms-agent-503015.iam.gserviceaccount.com
  _GCS_BUCKET: cms-agent-503015-cms-agent-state
  _PUBLIC_MCP_ENDPOINT: https://cms-agent-mcp-937996366809.us-central1.run.app/mcp
  # There is deliberately NO _EXECUTOR_JOBS here any more. The list of executor planes lives in
  # deploy/executor-jobs.txt, which scripts/pin-job-images.sh reads and the sync step below runs —
  # so this file and scripts/deploy-mcp.sh cannot disagree about which planes exist.
  #
  # It used to live here, as `_EXECUTOR_JOBS: continuation-tick`, and that is precisely how it went
  # wrong: a substitution is visible only to the trigger, so the two jobs added later were never in
  # it and were never synced by anything. The sync step passed green on every push while two of the
  # three live planes were not even considered. On 2026-09-07 both were found stale by hand.
  # Commit-identifying and immutable. The inline config used `:latest`, which is why "which commit is
  # live?" had no answer and a stale revision could serve for hours unnoticed.
  _IMAGE: '${_DEPLOY_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/mcp-service:${SHORT_SHA}'

# Required because the trigger specifies a service account. Cloud Build then refuses to start the build
# until logs have an unambiguous destination, since that account may not be able to write the default
# Google-owned logs bucket. CLOUD_LOGGING_ONLY needs no bucket provisioned or granted. Its absence is
# what produced "Your build failed to run: ... invalid argument" with zero steps and no log to read.
options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.mcp", "-t", "${_IMAGE}", "."]

  # Pushed explicitly rather than via the top-level `images:` key: `images:` uploads only AFTER every
  # step finishes, so the deploy below would reference a tag not yet in the registry.
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}"]

  # Deploy and verify are ONE step so the corrective redeploy below reuses the same deploy() with the
  # same flags — a second copy of the env-var/secret lists is exactly the drift hazard the header
  # warns about.
  #
  # THE RACE THIS STEP SURVIVES (first hit 2026-07-31, builds for 95e2821 and 970c414): two commits
  # merged minutes apart trigger two concurrent builds, and Cloud Build does not serialize them — the
  # OLDER commit's deploy can land AFTER the newer one's, leaving a stale image serving while both
  # builds' own deploys "succeeded". Resolution is by commit ancestry, so the newest commit always
  # wins: if the serving image's tag is an ANCESTOR of this build's commit, an older build outraced
  # us and we redeploy; if this build's commit is an ancestor of the SERVING tag, a newer build
  # already deployed and we yield green (its own build verifies it); if ancestry cannot be
  # established, fail loudly — that is either a rogue image or a git state this step cannot judge.
  - id: deploy-and-verify
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # THE FLAGS ARE NOT HERE. scripts/deploy-service.sh holds the service's entire Cloud Run
        # shape and scripts/deploy-mcp.sh runs the very same script, so the trigger path and the
        # shell path cannot disagree (KNOWN_ISSUES C-12). They used to: this file deployed 1Gi /
        # min-instances=1 with the runtime SA and eight variables while the shell script deployed
        # 512Mi / min-instances=0 with no service account and five. Adding a variable, a secret or
        # a sizing change is now one edit in that script and nothing else.
        #
        # MCP_ALLOWED_ORIGINS is deliberately NOT passed: this path has never set it, and the
        # script omits the key entirely when the variable is empty, so the trigger keeps leaving
        # whatever the service already has rather than replacing it with nothing.
        deploy() {
          PROJECT="${PROJECT_ID}" \
          REGION="${_DEPLOY_REGION}" \
          SERVICE="${_SERVICE}" \
          IMAGE="${_IMAGE}" \
          RUNTIME_SA="${_RUNTIME_SA}" \
          GCS_BUCKET="${_GCS_BUCKET}" \
          PUBLIC_MCP_ENDPOINT="${_PUBLIC_MCP_ENDPOINT}" \
          bash /workspace/scripts/deploy-service.sh
        }
        describe() { gcloud run services describe "${_SERVICE}" --region "${_DEPLOY_REGION}" --project "${PROJECT_ID}" --format "$1"; }

        deploy

        REVISION="$(describe 'value(status.latestReadyRevisionName)')"
        SERVING_IMAGE="$(describe 'value(spec.template.spec.containers[0].image)')"
        URL="$(describe 'value(status.url)')"
        echo "revision : $${REVISION}"
        echo "image    : $${SERVING_IMAGE}"
        echo "url      : $${URL}"

        # 1. Is the SERVED image the one this build produced? "Deployed" and "serving" are different
        #    facts, and health checks structurally cannot tell them apart. A mismatch here is almost
        #    always the concurrent-build race described above; resolve it by ancestry.
        if [ "$${SERVING_IMAGE}" != "${_IMAGE}" ]; then
          SERVING_TAG="$${SERVING_IMAGE##*:}"
          # Best effort: make the serving commit's history resolvable even on a narrow trigger fetch.
          git -C /workspace fetch --quiet origin "$${SERVING_TAG}" 2>/dev/null || true
          if git -C /workspace merge-base --is-ancestor "$${SERVING_TAG}" "${COMMIT_SHA}" 2>/dev/null; then
            echo "RACE: serving commit $${SERVING_TAG} is an ancestor of ${SHORT_SHA} — an older build deployed after this one. Redeploying so the newest commit serves."
            deploy
            SERVING_IMAGE="$(describe 'value(spec.template.spec.containers[0].image)')"
            REVISION="$(describe 'value(status.latestReadyRevisionName)')"
            echo "revision : $${REVISION} (after corrective redeploy)"
            if [ "$${SERVING_IMAGE}" != "${_IMAGE}" ]; then
              echo "FAIL: still not serving ${_IMAGE} after the corrective redeploy — inspect the service's revision history." >&2
              exit 1
            fi
          elif git -C /workspace merge-base --is-ancestor "${COMMIT_SHA}" "$${SERVING_TAG}" 2>/dev/null; then
            echo "NOTE: serving commit $${SERVING_TAG} is a DESCENDANT of ${SHORT_SHA} — a newer build already deployed. Newest wins; leaving it in place (its own build's verify covers it)."
            exit 0
          else
            echo "FAIL: serving image is not the image this build pushed (${_IMAGE}), and no ancestry could be established with its tag '$${SERVING_TAG}' — rogue image or unresolvable git state." >&2
            exit 1
          fi
        fi
        case "$${SERVING_IMAGE}" in
          *:latest) echo "WARNING: serving a mutable ':latest' tag — the live commit is unidentifiable. Remove the trigger's _IMAGE substitution." >&2 ;;
        esac

        # 2. Did every client-connection variable survive? This is the check whose absence let two
        #    releases take all clients down unnoticed. A loud failure beats a green build and a dead
        #    connection.
        ENV_NAMES="$(describe 'value(spec.template.spec.containers[0].env[].name)' | tr ';,' '\n\n')"
        echo "environment on the serving revision:"
        echo "$${ENV_NAMES}" | sed 's/^/  /'
        MISSING=""
        for VAR in CMS_AGENT_PUBLIC_MCP_ENDPOINT MCP_SCOPED_TOKENS_JSON NETLIFY_API_TOKEN DR_LURIE_MCP_ENDPOINT DR_LURIE_MCP_TOKEN PDF_TOOL_MCP_ENDPOINT PDF_TOOL_MCP_TOKEN PLATFORM_MCP_ENDPOINT PLATFORM_MCP_TOKEN FERNWELL_MCP_ENDPOINT FERNWELL_MCP_TOKEN; do
          echo "$${ENV_NAMES}" | grep -qx "$${VAR}" || MISSING="$${MISSING} $${VAR}"
        done
        if [ -n "$${MISSING}" ]; then
          echo "FAIL: the serving revision is missing client-connection variables:$${MISSING}" >&2
          echo "      Every client fails closed while repository.get_health still reports healthy." >&2
          exit 1
        fi

        # Advisory only — publishing being off is a valid state and must never fail a build. These are
        # never written by this config; they are reported so a change is visible.
        for VAR in DR_LURIE_PUBLISH_ENABLED PLATFORM_PUBLISH_ENABLED; do
          echo "$${ENV_NAMES}" | grep -qx "$${VAR}" || echo "note: $${VAR} is not set; publishing is disabled for that client."
        done

        curl -fsS "$${URL}/health" >/dev/null
        echo "health    : ok"
        echo "verified : $${REVISION} is serving ${_IMAGE} with all client connections present"

  # A service is not the whole system. A Cloud Run JOB keeps the image reference it was last given
  # and never follows a tag on its own, so the only thing that moves a plane is an explicit update.
  # That is why this step exists and why it runs on every push rather than being someone's checklist
  # item.
  #
  # THE BODY OF THIS STEP IS scripts/pin-job-images.sh, NOT INLINE BASH. It used to be inline, over
  # a job list held in a `_EXECUTOR_JOBS` substitution that only the trigger could see. The logic was
  # correct and the list was stale: it named `continuation-tick` alone and predated the other two
  # jobs, so this step reported success on every push while two of three planes were never even
  # looked at. Both were found stale by hand on 2026-09-07 — one of them the credential reconciler,
  # which would have re-narrowed all four tenants to an older tool allowlist and exited 0.
  #
  # Sharing the script with scripts/deploy-mcp.sh is the actual fix. A second hand-maintained list is
  # the disease, so there is exactly one: deploy/executor-jobs.txt. Adding a plane is one line there.
  #
  # PINS BY DIGEST, not by the ${_IMAGE} tag this build pushed, and reads that digest back off the
  # deployed revision rather than assuming what was pushed. A tag is a mutable pointer, so two refs
  # spelled alike are similarly NAMED, not provably the same ARTIFACT; the service escapes this only
  # because Cloud Run resolves its tag to a digest when it creates the revision, and a job gets no
  # such resolution. Digest-pinning makes plane and service the same artifact provably, and makes
  # `--check` a string compare instead of an Artifact Registry lookup.
  #
  # Deliberately does NOT touch the jobs' environment, secrets, args, service account or schedule.
  # Since T12.20 an executor plane needs no per-tenant configuration at all: the endpoint comes from
  # the project record (87c21af) and the token from that record's tokenSecretRef via Secret Manager,
  # resolved with the plane's own identity. Copying tenant variables onto each plane is the treadmill
  # this replaced.
  - id: sync-executor-planes
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        PROJECT=${PROJECT_ID} REGION=${_DEPLOY_REGION} SERVICE=${_SERVICE} \
          bash scripts/pin-job-images.sh
